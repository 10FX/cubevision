[package]
name = "cubevision"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reads a Rubik's Cube from a camera or a video: the moves turned, live or as a reconstruction"

[dependencies]
cube-core = { path = "../cube-core" }
cube-decode = { path = "../cube-decode" }
cube-infer = { path = "../cube-infer" }
cube-capture = { path = "../cube-capture" }
anyhow = "1"
cube-view = { path = "../cube-view" }
eframe = { version = "0.32", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
# The backends of the window's renderer (DirectX 12, Vulkan, Metal, OpenGL): eframe alone enables none
wgpu = "25"
png = "0.18"
# label: the crops of the cube saved as JPEG
jpeg-encoder = "0.6"
clap = { version = "4", features = ["derive", "env"] }
rayon = "1"
serde_json = "1"
# fetch-models: the release's zip downloaded, unpacked and checked
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }
