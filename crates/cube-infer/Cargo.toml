[package]
name = "cube-infer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Where a Rubik's Cube is in a frame and what its faces show: the two ONNX models, on the device asked for"

[dependencies]
cube-decode = { path = "../cube-decode" }
anyhow = "1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24", "load-dynamic", "cuda", "directml", "openvino"] }
rayon = "1"
serde_json = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
