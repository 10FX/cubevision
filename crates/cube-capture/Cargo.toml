[package]
name = "cube-capture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Frames out of a video file or a camera, as RGBA images with their times"

[dependencies]
anyhow = "1"
serde_json = "1"

# Media Foundation; Linux reads the camera through ffmpeg
[target.'cfg(windows)'.dependencies]
nokhwa = { version = "=0.10.11", features = ["input-native"] }
