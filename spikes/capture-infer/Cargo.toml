[package]
name = "spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ndarray = "0.17"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "api-24", "load-dynamic", "cuda", "directml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[dev-dependencies]

[profile.release]
debug = 1

# The webcam is measured on Windows (WSL sees no camera)
[target.'cfg(windows)'.dependencies]
nokhwa = { version = "=0.10.11", features = ["input-native"] }
